<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fffbfe" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1b1f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:," />
    <title>Uomi</title>
    <!-- Tauri adds a CSP nonce here; React Native Web reuses this sheet. -->
    <style id="react-native-stylesheet"></style>
    <style id="uomi-icon-font"></style>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      #root {
        display: flex;
      }
      :root {
        color-scheme: light dark;
        --background: #fffbfe;
        --foreground: #1c1b1f;
        --primary: #6750a4;
        --selection: #eaddff;
        --on-selection: #21005d;
        --outline: #79747e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #1c1b1f;
          --foreground: #e6e1e5;
          --primary: #d0bcff;
          --selection: #4f378b;
          --on-selection: #eaddff;
          --outline: #938f99;
        }
      }
      body {
        background: var(--background);
        color: var(--foreground);
      }
      * {
        box-sizing: border-box;
      }
      ::selection {
        background: var(--selection);
        color: var(--on-selection);
      }
      :focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 3px;
      }
      input {
        caret-color: var(--primary);
      }
      ::-webkit-scrollbar {
        width: 9px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--outline);
        border-radius: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web.tsx"></script>
  </body>
</html>
