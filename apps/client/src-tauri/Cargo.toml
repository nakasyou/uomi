[package]
name = "uomi"
version = "0.1.0"
description = "Local-first Omi audio client"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "process", "io-util", "macros"] }
rusqlite = { version = "0.37", features = ["bundled"] }
btleplug = "0.11"
dbus = "0.9"
futures-util = "0.3"
uuid = "1"
base64 = "0.22"
sha2 = "0.10"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "multipart",
  "stream",
] }
